<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="shortcut icon" href="../static/favicon.png" type="image/x-icon">
    <title>Shop - Cart</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <ul>
          <li class="logo">SHOP</li>
          <li><a class="link" href="home.html">Home</a></li>
          <li><a class="link active" href="cart.html">Cart</a></li>
          <li><a class="link" href="account.html">Account</a></li>
          <li><a class="link" href="home.html">Logout</a></li>
          <li><a class="link" href="login.html">LogIn</a></li>
          <li><a class="link" href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
        <section>
            <h1 class="title">Cart</h1>
            <div class="cart-items">
                <div class="cart-card">
                    <img src="../static/pictures/mouse.png" alt="mouse">
                    <div>
                        <h2>Mouse</h2>
                        <p class="price">$15</p>
                        <a href="home.html" class="btn remove-btn">Remove</a>
                    </div>
                </div>
            </div>
            <div class="total">
                <h2>Total: $15</h2>
                <a href="home.html" class="btn">continue shopping</a>
                <a href="home.html" class="btn pay-btn">Pay</a>
            </div>
            <hr>
            <p>Your cart is empty.</p>
        </section>
    </main>
    <footer class="footer">
      <p><span class="logo">SHOP</span>&copy; All Rights Reserved.</p>
    </footer>
  </body>
</html>
