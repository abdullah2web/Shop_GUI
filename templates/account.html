<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="shortcut icon" href="../static/favicon.png" type="image/x-icon">
    <title>Shop - Account</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <ul>
          <li class="logo">SHOP</li>
          <li><a class="link" href="home.html">Home</a></li>
          <li><a class="link" href="cart.html">Cart</a></li>
          <li><a class="link active" href="account.html">Account</a></li>
          <li><a class="link" href="home.html">Logout</a></li>
          <li><a class="link" href="login.html">LogIn</a></li>
          <li><a class="link" href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
        <section>
            <h1 class="title">Account</h1>
            <div class="center">
                <img src="../static/user.png">
                <div>
                    <h3>User1</h3>
                    <p>noreply@demo.com</p>
                </div>
            </div>
            <div class="product-grid">
                <div class="card">
                    <form method="POST" action="" enctype="multipart/form-data">
                        <div>
                            <h3>Change Your Info</h3>
                        </div>
                        <div class="row">
                            <input class="bar" type="text" name="username" placeholder="User1">
                        </div>
                        <div class="row">
                            <input class="bar" type="email" name="email" placeholder="noreply@demo.com">
                        </div>
                        <div class="row">
                            <input class="submit" type="submit" value="Update">
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
      <p><span class="logo">SHOP</span>&copy; All Rights Reserved.</p>
    </footer>
  </body>
</html>
